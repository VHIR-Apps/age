<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07152e" />
      <stop offset="50%" stop-color="#0a1d3d" />
      <stop offset="100%" stop-color="#040b17" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0a1d3d" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Ambient Light in Center -->
  <circle cx="256" cy="256" r="180" fill="url(#ambientGlow)" />

  <!-- Outer Chronometer Dial -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="3" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="165" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Dial Ticks (Every 30 deg) -->
  <g stroke="#38bdf8" stroke-width="3" opacity="0.6">
    <line x1="256" y1="76" x2="256" y2="92" stroke-width="4" stroke="url(#goldAccent)" />
    <line x1="256" y1="420" x2="256" y2="436" stroke-width="4" />
    <line x1="76" y1="256" x2="92" y2="256" stroke-width="4" />
    <line x1="420" y1="256" x2="436" y2="256" stroke-width="4" />
  </g>

  <!-- Hourglass Top Arch / Frame -->
  <path d="M 160 130 Q 256 115 352 130 L 336 155 Q 256 142 176 155 Z" fill="url(#borderGrad)" />
  <path d="M 160 382 Q 256 397 352 382 L 336 357 Q 256 370 176 357 Z" fill="url(#borderGrad)" />

  <!-- Hourglass Glass Geometry -->
  <path d="M 176 155 Q 256 142 336 155 C 330 220 286 242 270 256 C 286 270 330 292 336 357 Q 256 370 176 357 C 182 292 226 270 242 256 C 226 242 182 220 176 155 Z"
        fill="rgba(14, 165, 233, 0.12)" stroke="url(#neonCyan)" stroke-width="5" filter="url(#glow)" />

  <!-- Hourglass Glowing Core (Time Sand & Energy) -->
  <!-- Upper Sand (Falling) -->
  <path d="M 205 185 Q 256 180 307 185 C 295 225 275 240 256 254 C 237 240 217 225 205 185 Z" fill="url(#neonCyan)" opacity="0.85" />
  
  <!-- Streaming Sand Laser Beam -->
  <line x1="256" y1="252" x2="256" y2="330" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  <line x1="256" y1="252" x2="256" y2="330" stroke="url(#neonCyan)" stroke-width="6" opacity="0.6" />

  <!-- Lower Sand Accumulating -->
  <path d="M 195 350 Q 256 315 317 350 Z" fill="url(#neonCyan)" opacity="0.9" />

  <!-- Top Digital Counter Pill -->
  <rect x="200" y="80" width="112" height="34" rx="10" fill="#040c1a" stroke="url(#borderGrad)" stroke-width="2" />
  <text x="256" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="2">00:00</text>

  <!-- BD Emblem Badge at Bottom Intersection -->
  <g transform="translate(256, 385)">
    <circle cx="0" cy="0" r="46" fill="#040c1a" stroke="url(#goldAccent)" stroke-width="3.5" filter="url(#glow)" />
    <circle cx="0" cy="0" r="38" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="0" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">BD</text>
  </g>

  <!-- Sparkles -->
  <circle cx="150" cy="180" r="3" fill="#ffffff" filter="url(#glow)" />
  <circle cx="360" cy="330" r="2.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="350" cy="190" r="2" fill="#2dd4bf" />
</svg>
